<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="CampusNotify Admin Hub — Create and send announcements, events, notifications, and polls.">
  <title>Admin Hub — CampusNotify</title>
  <link rel="stylesheet" href="styles.css">

  <style>
    /* Admin Hub — form + modal styles (built on the same design tokens as styles.css) */
    .ah-header-side { display: flex; flex-direction: column; align-items: flex-end; gap: var(--space-md, 16px); }
    .ah-error { display: none; margin-bottom: var(--space-md, 16px); padding: 12px 16px; border-radius: var(--radius-md, 12px); font-size: .9rem;
      color: #fca5a5; background: rgba(239, 68, 68, .1); border: 1px solid rgba(239, 68, 68, .35); }

    /* Modal layout: wider, with fixed header/footer and a scrolling body */
    .modal.ah-modal { max-width: 750px; display: flex; flex-direction: column; overflow: hidden; }
    .ah-modal .modal-header { flex-shrink: 0; }
    .ah-modal .modal-header h2 { margin: 0; font-size: 1.5rem; }
    .ah-modal .modal-body { flex: 1; overflow-y: auto; }
    .ah-modal .modal-footer { flex-shrink: 0; }

    /* Form helpers (inputs themselves use styles.css: .form-input / .form-select / .form-textarea) */
    .ah-row { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-lg); }
    .ah-muted { font-weight: 400; opacity: .7; margin-left: 4px; }
    .form-textarea { min-height: 150px; resize: vertical; line-height: 1.6; }
    .form-select option { background: var(--bg-surface); color: var(--text-primary); }
    .form-select:disabled { opacity: .45; cursor: not-allowed; }
    .form-group.is-disabled .form-label { opacity: .5; }
    .form-input.invalid, .form-textarea.invalid { border-color: #ef4444; box-shadow: 0 0 0 3px rgba(239, 68, 68, .2); }
    input[type="date"].form-input, input[type="time"].form-input { color-scheme: dark; }
    body.light-theme input[type="date"].form-input, body.light-theme input[type="time"].form-input { color-scheme: light; }

    /* Sent-items list */
    .ah-actions-danger:hover { color: #ef4444; border-color: rgba(239, 68, 68, .5); }

    /* Delete confirmation popup */
    .modal.ah-confirm { max-width: 440px; }
    .ah-confirm .modal-body p { margin: 0; line-height: 1.6; color: var(--text-secondary); }
    .ah-btn-danger { background: #ef4444; border-color: #ef4444; color: #fff; }
    .ah-btn-danger:hover { background: #dc2626; border-color: #dc2626; }
    .ah-audience { display: inline-flex; align-items: center; gap: 6px; font-size: .8rem; color: var(--text-muted); }


    /* Poll form */
    .form-textarea.pl-question { min-height: 84px; }
    .pl-counter { display: flex; justify-content: space-between; gap: 12px; margin-top: 6px; font-size: .8rem; color: var(--text-muted); }
    .pl-choices { display: flex; flex-direction: column; gap: 10px; }
    .pl-choice { display: flex; align-items: center; gap: 10px; }
    .pl-choice.dragging { opacity: .45; }
    .pl-grip { cursor: grab; user-select: none; color: var(--text-muted); font-size: 1.1rem; line-height: 1; padding: 6px 2px; letter-spacing: -2px; }
    .pl-grip:active { cursor: grabbing; }
    .pl-num { width: 22px; flex-shrink: 0; text-align: center; font-size: .85rem; font-weight: 600; color: var(--text-muted); }
    .pl-choice .form-input { flex: 1; min-width: 0; }
    .pl-remove:disabled { opacity: .3; cursor: not-allowed; }
    .pl-remove:not(:disabled):hover { color: #ef4444; }
    .pl-add { margin-top: 10px; padding: 9px 16px; border-radius: var(--radius-md, 12px); font: inherit; font-size: .9rem; font-weight: 600; cursor: pointer;
      color: #8b5cf6; background: transparent; border: 1px dashed rgba(139, 92, 246, .6); }
    .pl-add:hover:not(:disabled) { background: rgba(139, 92, 246, .1); }
    .pl-add:disabled { opacity: .4; cursor: not-allowed; }
    .pl-pills { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 var(--space-md, 16px); }
    .pl-pill { padding: 5px 12px; border-radius: 999px; font-size: .82rem; color: var(--text-secondary, var(--text-primary)); border: 1px solid rgba(148, 163, 184, .3); }
    .type-poll { color: #a78bfa; }
    .pl-result { margin-bottom: 12px; }
    .pl-result-head { display: flex; justify-content: space-between; gap: 12px; font-size: .88rem; margin-bottom: 5px; }
    .pl-result-head span:last-child { color: var(--text-muted); white-space: nowrap; }
    .pl-bar-track { height: 8px; border-radius: 999px; background: rgba(148, 163, 184, .2); overflow: hidden; }
    .pl-bar { height: 100%; border-radius: 999px; background: #8b5cf6; }
    .pl-voter-group { margin-bottom: var(--space-lg, 24px); }
    .pl-voter-group h4 { margin: 0 0 8px; font-size: .95rem; display: flex; justify-content: space-between; gap: 12px; }
    .pl-voter-row { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-top: 1px solid rgba(148, 163, 184, .2); font-size: .88rem; }
    .pl-voter-row small { display: block; color: var(--text-muted); }
    .pl-voter-row time { color: var(--text-muted); font-size: .8rem; white-space: nowrap; }

    @media (max-width: 640px) {
      .ah-header-side { align-items: stretch; width: 100%; }
      .ah-row { grid-template-columns: 1fr; gap: 0; }
    }
  </style>
</head>

<body>
  <div class="app-layout">
    <div id="app-sidebar"></div>

    <main class="main-content">
      <!-- Page Header -->
      <div class="page-header animate-fade-in">
        <div class="page-header-row">
          <div>
            <h1>🛠️ <span class="text-gradient">Admin Hub</span></h1>
            <p class="page-subtitle">Create and send announcements, events, notifications, and polls to your campus.</p>
          </div>
          <div class="ah-header-side">
            <div class="search-bar">
              <span class="search-icon">🔍</span>
              <input type="text" placeholder="Search sent updates..." id="hubSearch">
            </div>
            <button class="btn btn-primary" id="btnCreate" style="white-space:nowrap;">✚ New Announcement</button>
          </div>
        </div>
      </div>

      <!-- Filters -->
      <div class="hub-filters animate-fade-in">
        <div class="hub-type-filters" id="typeFilters">
          <button class="hub-filter-chip active" data-type="announcement">📢 Announcements</button>
          <button class="hub-filter-chip" data-type="event">📅 Events</button>
          <button class="hub-filter-chip" data-type="notification">🔔 Notifications</button>
          <button class="hub-filter-chip" data-type="poll">📊 Polls</button>
        </div>
        <div class="hub-category-filters" id="categoryFilters">
          <button class="hub-cat-chip active" data-cat="all">All</button>
          <button class="hub-cat-chip" data-cat="Academic">Academic</button>
          <button class="hub-cat-chip" data-cat="Student Life">Student Life</button>
          <button class="hub-cat-chip" data-cat="Facilities">Facilities</button>
          <button class="hub-cat-chip" data-cat="Sports">Sports</button>
          <button class="hub-cat-chip" data-cat="Career">Career</button>
        </div>
      </div>

      <!-- Sent items -->
      <div id="hubError" class="ah-error" role="alert"></div>
      <div id="hubFeed" class="hub-feed stagger"></div>
      <div id="hubEmpty" class="empty-state" style="display:none;">
        <div class="empty-icon">📭</div>
        <h3>Nothing sent yet</h3>
        <p>Use the buttons above to publish your first announcement, event, notification, or poll.</p>
      </div>
    </main>
  </div>

  <!-- Modals are built by script below -->
  <div id="modalHost"></div>
  <div id="toast-container" class="toast-container"></div>

  <script type="module" src="app.js"></script>
  <script src="stores.js"></script>
  <script type="module">
    import { auth, db } from './firebase-config.js';
    import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
    import {
      collection, doc, addDoc, updateDoc, deleteDoc, onSnapshot, serverTimestamp
    } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';

    (function () {
      'use strict';

      // ─── Options ───
      const CATEGORIES = [
        { value: 'Academic', label: 'Academic' },
        { value: 'Student Life', label: 'Student Life' },
        { value: 'Facilities', label: 'Facilities' },
        { value: 'Sports', label: 'Sports' },
        { value: 'Career', label: 'Career' }
      ];
      const PRIORITIES = [
        { value: 'normal', label: '🔵 General' },
        { value: 'important', label: '🟡 Important' },
        { value: 'urgent', label: '🔴 Urgent' }
      ];
      const NOTIF_TYPES = [
        { value: 'info', label: 'ℹ️ Information', icon: '📢' },
        { value: 'warning', label: '⚠️ Warning / Reminder', icon: '⚠️' },
        { value: 'alert', label: '🔴 Urgent Alert', icon: '🔴' },
        { value: 'success', label: '✅ Success / Update', icon: '✅' }
      ];
      const NOTIF_ICONS = ['📢', '🔔', '⚠️', '🔴', '✅', '📅', '🎉', '💡', '🏫', '💻'];
      const AUDIENCES = [
        { value: 'all', label: '👥 All Campus (Student Only)', short: '👥 All Students' },
        { value: 'students', label: '🎓 Specific Students', short: '🎓 Specific Students' },
        { value: 'faculty', label: '🧑‍🏫 Faculty & Staff', short: '🧑‍🏫 Faculty & Staff' }
      ];
      const DEPARTMENTS = [
        { value: 'all', label: 'All Departments' },
        { value: 'Computer Science', label: 'Computer Science' },
        { value: 'Engineering', label: 'Engineering' },
        { value: 'Business', label: 'Business' },
        { value: 'Art and Science', label: 'Art and Science' },
        { value: 'Medicine', label: 'Medicine' },
        { value: 'Law', label: 'Law' }
      ];
      const YEARS = [
        { value: 'all', label: 'All Year Level' },
        { value: '1st Year', label: '1st Year' },
        { value: '2nd Year', label: '2nd Year' },
        { value: '3rd Year', label: '3rd Year' },
        { value: '4th Year', label: '4th Year' },
        { value: 'Graduated', label: 'Graduated' }
      ];

      // ─── State ───
      let typeFilter = 'announcement';
      let categoryFilter = 'all';
      let searchTerm = '';

      // ─── Helpers ───
      const $ = (id) => document.getElementById(id);
      const esc = (s) => (s === null || s === undefined ? '' : String(s)).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
      const options = (list) => list.map(o => `<option value="${esc(o.value)}">${esc(o.label)}</option>`).join('');
      const pad = (n) => String(n).padStart(2, '0');
      const isoDay = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
      const today = () => isoDay(new Date());

      function to12h(time24) {
        const [h, m] = time24.split(':').map(Number);
        return `${(h % 12) || 12}:${String(m).padStart(2, '0')} ${h >= 12 ? 'PM' : 'AM'}`;
      }

      function currentAuthor() {
        try {
          const user = Auth.getUser();
          return (user && (user.name || user.fullName || user.displayName)) || 'Admin';
        } catch (e) {
          return 'Admin';
        }
      }

      function audienceLabel(item) {
        // announcement_SS / event_SS documents carry target1 (department) and target2 (year level)
        if (item.target1) {
          const dept = DEPARTMENTS.find(d => d.value.toLowerCase() === String(item.target1).toLowerCase());
          return `<span class="ah-audience">${esc('🎓 Specific Students · ' + (dept ? dept.label : item.target1) + ' · ' + (item.target2 || 'All Year Level'))}</span>`;
        }
        const target = item.target || 'all';
        let label = (AUDIENCES.find(a => a.value === target) || AUDIENCES[0]).short;
        if (target === 'students') {
          if (item.department && item.department !== 'all') label += ' · ' + item.department;
          if (item.year && item.year !== 'all') label += ' · ' + item.year;
        }
        return `<span class="ah-audience">${esc(label)}</span>`;
      }

      // ─── Modals ───
      function audienceFields(p, hint = '') {
        return `
          <div class="form-group">
            <label class="form-label" for="${p}Target">Audience Target</label>
            <select class="form-select" id="${p}Target">${options(AUDIENCES)}</select>
            ${hint ? `<div class="text-muted" style="font-size:.8rem; margin-top:6px;">${hint}</div>` : ''}
          </div>
          <div class="ah-row">
            <div class="form-group is-disabled" id="${p}DeptField">
              <label class="form-label" for="${p}Dept">Department <span class="ah-muted" id="${p}DeptHint">(Disabled)</span></label>
              <select class="form-select" id="${p}Dept" disabled>${options(DEPARTMENTS)}</select>
            </div>
            <div class="form-group is-disabled" id="${p}YearField">
              <label class="form-label" for="${p}Year">Academic Year <span class="ah-muted" id="${p}YearHint">(Disabled)</span></label>
              <select class="form-select" id="${p}Year" disabled>${options(YEARS)}</select>
            </div>
          </div>`;
      }

      function modal(id, title, body, submitLabel) {
        return `
          <div class="modal-overlay" id="${id}">
            <div class="modal ah-modal" role="dialog" aria-modal="true" aria-labelledby="${id}Title">
              <div class="modal-header">
                <h2 id="${id}Title">${title}</h2>
                <button class="btn btn-ghost btn-icon sm" aria-label="Close" data-close="${id}">✕</button>
              </div>
              <div class="modal-body">${body}</div>
              <div class="modal-footer">
                <button class="btn btn-secondary" data-close="${id}">Cancel</button>
                <button class="btn btn-primary" data-submit="${id}">${submitLabel}</button>
              </div>
            </div>
          </div>`;
      }

      const FORMS = {
        announcement: {
          modalId: 'announcementModal', prefix: 'ann',
          html: `
            <div class="form-group">
              <label class="form-label" for="annTitle">Title</label>
              <input class="form-input" id="annTitle" type="text" placeholder="Enter announcement title" maxlength="120">
            </div>
            <div class="form-group">
              <label class="form-label" for="annBody">Content</label>
              <textarea class="form-textarea" id="annBody" placeholder="Write your announcement..."></textarea>
            </div>
            <div class="ah-row">
              <div class="form-group">
                <label class="form-label" for="annCategory">Category</label>
                <select class="form-select" id="annCategory">${options(CATEGORIES)}</select>
              </div>
              <div class="form-group">
                <label class="form-label" for="annPriority">Priority</label>
                <select class="form-select" id="annPriority">${options(PRIORITIES)}</select>
              </div>
            </div>
            ${audienceFields('ann', '<strong>All Campus</strong> goes to the Campus Hub. <strong>Specific Students</strong> goes only to students of the chosen department and year level (shown in their For You feed).')}
            <div class="form-group">
              <label class="form-checkbox-group"><input type="checkbox" id="annPinned"> 📌 Pin this announcement</label>
            </div>`
        },
        event: {
          modalId: 'eventModal', prefix: 'ev',
          html: `
            <div class="form-group">
              <label class="form-label" for="evTitle">Title</label>
              <input class="form-input" id="evTitle" type="text" placeholder="Enter event title" maxlength="120">
            </div>
            <div class="form-group">
              <label class="form-label" for="evDesc">Description</label>
              <textarea class="form-textarea" id="evDesc" placeholder="Describe the event..."></textarea>
            </div>
            <div class="ah-row">
              <div class="form-group">
                <label class="form-label" for="evDate">Date</label>
                <input class="form-input" id="evDate" type="date">
              </div>
              <div class="form-group">
                <label class="form-label" for="evTime">Time</label>
                <input class="form-input" id="evTime" type="time">
              </div>
            </div>
            <div class="ah-row">
              <div class="form-group">
                <label class="form-label" for="evCategory">Category</label>
                <select class="form-select" id="evCategory">${options(CATEGORIES)}</select>
              </div>
              <div class="form-group">
                <label class="form-label" for="evLocation">Location</label>
                <input class="form-input" id="evLocation" type="text" placeholder="e.g. Main Auditorium">
              </div>
            </div>
            ${audienceFields('ev', '<strong>All Campus</strong> goes to the Campus Hub. <strong>Specific Students</strong> goes only to students of the chosen department and year level (shown in their For You feed).')}`
        },
        notification: {
          modalId: 'notificationModal', prefix: 'nt',
          html: `
            <div class="form-group">
              <label class="form-label" for="ntTitle">Title</label>
              <input class="form-input" id="ntTitle" type="text" placeholder="Enter notification title" maxlength="100">
            </div>
            <div class="form-group">
              <label class="form-label" for="ntMessage">Message</label>
              <textarea class="form-textarea" id="ntMessage" placeholder="Write your notification..." style="min-height:110px;" maxlength="1000"></textarea>
            </div>
            <div class="form-group">
              <label class="form-label" for="ntCategory">Category</label>
              <select class="form-select" id="ntCategory">${options(CATEGORIES)}</select>
            </div>
            <div class="ah-row">
              <div class="form-group">
                <label class="form-label" for="ntType">Type</label>
                <select class="form-select" id="ntType">${options(NOTIF_TYPES)}</select>
              </div>
              <div class="form-group">
                <label class="form-label" for="ntIcon">Icon</label>
                <select class="form-select" id="ntIcon">${NOTIF_ICONS.map(i => `<option value="${i}">${i}</option>`).join('')}</select>
              </div>
            </div>
            ${audienceFields('nt', '<strong>All Campus</strong> goes to the Campus Hub. <strong>Specific Students</strong> goes only to students of the chosen department and year level (shown in their For You feed).')}`
        },
        poll: {
          modalId: 'pollModal', prefix: 'pl',
          html: `
            <div class="form-group">
              <label class="form-label" for="plQuestion">Question</label>
              <textarea class="form-textarea pl-question" id="plQuestion" placeholder="e.g. What activity would you like for Foundation Week?" maxlength="200"></textarea>
              <div class="pl-counter"><span>Ask one clear question students can answer by picking a choice.</span><span id="plQuestionCount">0/200</span></div>
            </div>
            <div class="form-group">
              <label class="form-label" for="plDesc">Description <span class="ah-muted">(Optional)</span></label>
              <input class="form-input" id="plDesc" type="text" placeholder="Add context for students" maxlength="300">
            </div>
            <div class="form-group">
              <label class="form-label">Choices <span class="ah-muted" id="plChoiceCount"></span></label>
              <div class="pl-choices" id="plChoices"></div>
              <button type="button" class="pl-add" id="plAddChoice">+ Add Choice</button>
            </div>
            <div class="ah-row">
              <div class="form-group">
                <label class="form-label" for="plCategory">Category</label>
                <select class="form-select" id="plCategory">${options(CATEGORIES)}</select>
              </div>
              <div class="form-group">
                <label class="form-label" for="plClosing">Closing Date</label>
                <input class="form-input" id="plClosing" type="date">
              </div>
            </div>
            ${audienceFields('pl', 'Students see this on Campus Hub only when the audience is <strong>All Campus (Student Only)</strong>.')}`
        }
      };

      const TITLES = { announcement: ['Create Announcement', 'Publish'], event: ['Create Event', 'Create Event'], notification: ['Send Notification', 'Send'], poll: ['Create Poll', 'Create Poll'] };

      function buildModals() {
        $('modalHost').innerHTML = Object.keys(FORMS).map(kind =>
          modal(FORMS[kind].modalId, TITLES[kind][0], FORMS[kind].html, TITLES[kind][1])
        ).join('');

        Object.values(FORMS).forEach(f => {
          $(f.prefix + 'Target').addEventListener('change', () => syncAudience(f.prefix));
        });
        $('ntType').addEventListener('change', () => {
          const t = NOTIF_TYPES.find(x => x.value === $('ntType').value);
          if (t) $('ntIcon').value = t.icon;
        });
        $('modalHost').addEventListener('input', (e) => e.target.classList.remove('invalid'));
        $('modalHost').insertAdjacentHTML('beforeend', `
          <div class="modal-overlay" id="pollVotersModal">
            <div class="modal ah-modal" role="dialog" aria-modal="true" aria-labelledby="pollVotersTitle">
              <div class="modal-header">
                <h2 id="pollVotersTitle">Poll voters</h2>
                <button class="btn btn-ghost btn-icon sm" aria-label="Close" data-close="pollVotersModal">✕</button>
              </div>
              <div class="modal-body" id="pollVotersBody"></div>
              <div class="modal-footer">
                <button class="btn btn-secondary" data-close="pollVotersModal">Close</button>
              </div>
            </div>
          </div>
          <div class="modal-overlay" id="deleteConfirmModal">
            <div class="modal ah-modal ah-confirm" role="dialog" aria-modal="true" aria-labelledby="deleteConfirmTitle">
              <div class="modal-header">
                <h2 id="deleteConfirmTitle">Delete this item?</h2>
                <button class="btn btn-ghost btn-icon sm" aria-label="Close" data-close="deleteConfirmModal">✕</button>
              </div>
              <div class="modal-body">
                <p id="deleteConfirmText">This can’t be undone.</p>
              </div>
              <div class="modal-footer">
                <button class="btn btn-secondary" data-close="deleteConfirmModal">Cancel</button>
                <button class="btn ah-btn-danger" id="deleteConfirmBtn" data-confirm-delete>🗑️ Delete</button>
              </div>
            </div>
          </div>`);
        initPollForm();
      }

      // ─── Poll form: choices list ───
      const MIN_CHOICES = 2, MAX_CHOICES = 6;

      function choiceRow(value = '') {
        const row = document.createElement('div');
        row.className = 'pl-choice';
        row.innerHTML = `
          <span class="pl-grip" title="Drag to reorder" aria-hidden="true">⋮⋮</span>
          <span class="pl-num"></span>
          <input class="form-input" type="text" maxlength="80" value="${esc(value)}">
          <button type="button" class="btn btn-ghost btn-icon sm pl-remove" data-remove-choice>🗑️</button>`;
        return row;
      }

      function refreshChoices() {
        const rows = [...$('plChoices').children];
        rows.forEach((row, i) => {
          row.querySelector('.pl-num').textContent = i + 1;
          const input = row.querySelector('input');
          input.placeholder = 'Choice ' + (i + 1);
          input.setAttribute('aria-label', 'Choice ' + (i + 1));
          const rm = row.querySelector('.pl-remove');
          rm.disabled = rows.length <= MIN_CHOICES;
          rm.setAttribute('aria-label', 'Remove choice ' + (i + 1));
        });
        $('plAddChoice').disabled = rows.length >= MAX_CHOICES;
        $('plChoiceCount').textContent = `(${rows.length}/${MAX_CHOICES})`;
      }

      function addChoice(focus) {
        if ($('plChoices').children.length >= MAX_CHOICES) return;
        const row = choiceRow();
        $('plChoices').appendChild(row);
        refreshChoices();
        if (focus) row.querySelector('input').focus();
      }

      function resetPollForm() {
        $('plChoices').innerHTML = '';
        for (let i = 0; i < MIN_CHOICES; i++) $('plChoices').appendChild(choiceRow());
        refreshChoices();
        const d = new Date(); d.setDate(d.getDate() + 7);
        $('plClosing').min = today();
        $('plClosing').value = isoDay(d);
        $('plQuestionCount').textContent = '0/200';
      }

      function initPollForm() {
        const list = $('plChoices');
        let dragging = null;

        $('plAddChoice').addEventListener('click', () => addChoice(true));
        $('plQuestion').addEventListener('input', () => { $('plQuestionCount').textContent = $('plQuestion').value.length + '/200'; });

        list.addEventListener('click', (e) => {
          const rm = e.target.closest('[data-remove-choice]');
          if (!rm || list.children.length <= MIN_CHOICES) return;
          rm.closest('.pl-choice').remove();
          refreshChoices();
        });

        // Enter adds a new choice instead of doing nothing
        list.addEventListener('keydown', (e) => {
          if (e.key !== 'Enter' || !e.target.matches('input')) return;
          e.preventDefault();
          const rows = [...list.children];
          const next = e.target.closest('.pl-choice').nextElementSibling;
          if (next) next.querySelector('input').focus();
          else if (rows.length < MAX_CHOICES) addChoice(true);
        });

        // Drag to reorder (only from the grip, so text selection in the inputs still works)
        list.addEventListener('mousedown', (e) => {
          const grip = e.target.closest('.pl-grip');
          if (grip) grip.closest('.pl-choice').draggable = true;
        });
        list.addEventListener('dragstart', (e) => {
          if (!e.target.classList || !e.target.classList.contains('pl-choice')) return;
          dragging = e.target;
          e.dataTransfer.effectAllowed = 'move';
          e.dataTransfer.setData('text/plain', '');
          setTimeout(() => dragging && dragging.classList.add('dragging'), 0);
        });
        list.addEventListener('dragover', (e) => {
          if (!dragging) return;
          e.preventDefault();
          const after = [...list.children].filter(r => r !== dragging)
            .find(r => e.clientY < r.getBoundingClientRect().top + r.offsetHeight / 2);
          if (after) list.insertBefore(dragging, after); else list.appendChild(dragging);
        });
        list.addEventListener('dragend', () => {
          if (!dragging) return;
          dragging.classList.remove('dragging');
          dragging.draggable = false;
          dragging = null;
          refreshChoices();
        });
        document.addEventListener('mouseup', () => {
          list.querySelectorAll('.pl-choice[draggable="true"]').forEach(r => { if (!dragging) r.draggable = false; });
        });
      }

      // Department and Year unlock only for "Specific Students"
      function syncAudience(p) {
        const on = $(p + 'Target').value === 'students';
        // Announcements and events need a real department when sent to Specific Students
        if (p === 'ann' || p === 'ev' || p === 'nt') {
          const dept = $(p + 'Dept');
          dept.options[0].disabled = on;
          if (on && dept.value === 'all') dept.selectedIndex = 1;
          if (!on) dept.selectedIndex = 0;
        }
        ['Dept', 'Year'].forEach(k => {
          $(p + k).disabled = !on;
          $(p + k + 'Field').classList.toggle('is-disabled', !on);
          $(p + k + 'Hint').textContent = on ? '' : '(Disabled)';
        });
      }

      function openForm(kind) {
        const f = FORMS[kind];
        if (!f) return;
        const el = $(f.modalId);
        el.querySelectorAll('input[type="text"], input[type="date"], input[type="time"], textarea').forEach(i => { i.value = ''; i.classList.remove('invalid'); });
        el.querySelectorAll('select').forEach(i => { i.selectedIndex = 0; });
        el.querySelectorAll('input[type="checkbox"]').forEach(i => { i.checked = false; });
        if (kind === 'event') $('evDate').value = today();
        if (kind === 'notification') $('ntIcon').value = NOTIF_TYPES[0].icon;
        if (kind === 'poll') resetPollForm();
        syncAudience(f.prefix);
        el.querySelector('.modal-body').scrollTop = 0;
        UI.openModal(f.modalId);
        setTimeout(() => { const first = el.querySelector('.form-input, .form-textarea'); if (first) first.focus(); }, 150);
      }

      function validate(ids) {
        const missing = ids.filter(id => !$(id).value.trim());
        missing.forEach(id => $(id).classList.add('invalid'));
        if (missing.length) {
          $(missing[0]).focus();
          UI.toast('Please fill in the highlighted fields.', 'warning');
        }
        return missing.length === 0;
      }

      // ─── Firebase: announcement_hub, event_hub, notification_hub and poll_hub ───
      function toHubDoc(snapshotDoc, collectionName) {
        const data = snapshotDoc.data({ serverTimestamps: 'estimate' });
        const createdMs = data.createdAt && data.createdAt.toMillis ? data.createdAt.toMillis() : 0;
        return {
          ...data,
          id: snapshotDoc.id,
          _collection: collectionName,
          createdMs,
          date: data.date || (createdMs ? isoDay(new Date(createdMs)) : today())
        };
      }

      const HUB = {
        announcement: { collection: 'announcement_hub', items: [], error: null, ready: false, unsubscribe: null },
        event: { collection: 'event_hub', items: [], error: null, ready: false, unsubscribe: null },
        announcementSS: { collection: 'announcement_SS', items: [], error: null, ready: false, unsubscribe: null },
        eventSS: { collection: 'event_SS', items: [], error: null, ready: false, unsubscribe: null },
        notificationSS: { collection: 'notification_SS', items: [], error: null, ready: false, unsubscribe: null },
        notification: { collection: 'notification_hub', items: [], error: null, ready: false, unsubscribe: null },
        poll: { collection: 'poll_hub', items: [], error: null, ready: false, unsubscribe: null }
      };

      // Who voted on which poll (poll_voters is readable by admins only)
      const VOTERS = { items: [], error: null, unsubscribe: null };
      let votersPollId = null;

      // Wait for the signed-in admin before listening, otherwise Firestore rejects the request.
      function startHubSync() {
        onAuthStateChanged(auth, (user) => {
          if (VOTERS.unsubscribe) { VOTERS.unsubscribe(); VOTERS.unsubscribe = null; }
          if (user) {
            VOTERS.unsubscribe = onSnapshot(collection(db, 'poll_voters'), (snapshot) => {
              VOTERS.items = snapshot.docs.map((d) => {
                const data = d.data({ serverTimestamps: 'estimate' });
                return { ...data, id: d.id, createdMs: data.createdAt && data.createdAt.toMillis ? data.createdAt.toMillis() : 0 };
              });
              VOTERS.error = null;
              renderFeed();
            }, (err) => {
              console.error('Admin Hub: poll_voters listener failed', err);
              VOTERS.items = [];
              VOTERS.error = err;
              renderFeed();
            });
          }
          Object.values(HUB).forEach((hub) => {
            if (hub.unsubscribe) { hub.unsubscribe(); hub.unsubscribe = null; }
            if (!user) return;

            hub.unsubscribe = onSnapshot(collection(db, hub.collection), (snapshot) => {
              hub.items = snapshot.docs
                .map((d) => toHubDoc(d, hub.collection))
                // Items sent by staff (senderRole: "staff") are private to the Staff Hub — hide them from the Admin Hub
                .filter((item) => String(item.senderRole || '').toLowerCase() !== 'staff');
              hub.error = null;
              hub.ready = true;
              renderFeed();
            }, (err) => {
              console.error('Admin Hub: ' + hub.collection + ' listener failed', err);
              hub.items = [];
              hub.error = err;
              hub.ready = true;
              renderFeed();
            });
          });
        });
      }

      const LABELS = { announcement: 'Announcements', announcementSS: 'Specific-student announcements', eventSS: 'Specific-student events', notificationSS: 'Specific-student notifications', event: 'Events', notification: 'Notifications', poll: 'Polls' };
      const CREATE_LABELS = { announcement: '✚ New Announcement', event: '✚ New Event', notification: '✚ New Notification', poll: '✚ New Poll' };

      // ─── Submit ───
      let sending = false;

      // Wraps send(): blocks double-clicks, shows progress on the button, and reports any error
      async function submit(kind) {
        if (sending) return;
        sending = true;
        const button = document.querySelector(`[data-submit="${FORMS[kind].modalId}"]`);
        const label = button ? button.textContent : '';
        if (button) { button.disabled = true; button.textContent = 'Sending…'; }
        try {
          await send(kind);
        } catch (err) {
          console.error('Admin Hub: unexpected error while sending', err);
          UI.toast('Something went wrong: ' + ((err && err.message) || err), 'error');
        } finally {
          sending = false;
          if (button) { button.disabled = false; button.textContent = label; }
        }
      }

      function withTimeout(promise, ms) {
        let timer;
        const timeout = new Promise((_, reject) => {
          timer = setTimeout(() => {
            const err = new Error('Firebase did not respond after ' + (ms / 1000) + ' seconds. Check your internet connection, then look at the list before trying again, because it may still arrive.');
            err.code = 'timeout';
            reject(err);
          }, ms);
        });
        return Promise.race([promise, timeout]).finally(() => clearTimeout(timer));
      }

      // Only "All Campus (Student Only)" is connected to Firebase.
      function requireAllCampus(prefix) {
        if ($(prefix + 'Target').value !== 'all') {
          UI.toast('Only “All Campus (Student Only)” is connected to Firebase right now. Please choose it as the audience.', 'warning');
          $(prefix + 'Target').focus();
          return false;
        }
        if (!auth.currentUser) {
          UI.toast('You are not signed in. Please log in again.', 'error');
          return false;
        }
        return true;
      }

      // Announcements and events: "All Campus" → announcement_hub / event_hub,
      // "Specific Students" → announcement_SS / event_SS with target1 (department) and target2 (year level).
      // Faculty & Staff is not connected yet.
      function requireAudience(prefix) {
        const target = $(prefix + 'Target').value;
        if (target === 'faculty') {
          UI.toast('Faculty & Staff is not connected to Firebase yet. Choose All Campus or Specific Students.', 'warning');
          $(prefix + 'Target').focus();
          return false;
        }
        if (target === 'students' && $(prefix + 'Dept').value === 'all') {
          UI.toast('Pick a specific department for Specific Students.', 'warning');
          $(prefix + 'Dept').focus();
          return false;
        }
        if (!auth.currentUser) {
          UI.toast('You are not signed in. Please log in again.', 'error');
          return false;
        }
        return true;
      }

      function audienceTarget(prefix, kind) {
        if ($(prefix + 'Target').value !== 'students') {
          return { collection: HUB[kind].collection, fields: hubFields(), sentTo: '' };
        }
        const dept = $(prefix + 'Dept');
        const year = $(prefix + 'Year').value;
        const target1 = dept.value.toLowerCase();
        const target2 = year === 'all' ? 'All Year Level' : year;
        return {
          collection: HUB[kind + 'SS'].collection,
          fields: {
            author: currentAuthor(),
            authorId: auth.currentUser.uid,
            createdAt: serverTimestamp(),
            target1,
            target2,
            senderRole: 'admin'
          },
          sentTo: dept.options[dept.selectedIndex].text + ' · ' + target2
        };
      }

      function hubFields() {
        return {
          author: currentAuthor(),
          authorId: auth.currentUser.uid,
          createdAt: serverTimestamp(),
          target: 'all',
          department: 'all',
          year: 'all'
        };
      }

      async function send(kind) {
        let payload;
        let aud = null;
        if (kind === 'announcement') {
          if (!validate(['annTitle', 'annBody']) || !requireAudience('ann')) return;
          aud = audienceTarget('ann', 'announcement');
          payload = {
            title: $('annTitle').value.trim(),
            body: $('annBody').value.trim(),
            category: $('annCategory').value,
            priority: $('annPriority').value,
            pinned: $('annPinned').checked,
            date: today(),
            ...aud.fields
          };
        } else if (kind === 'event') {
          if (!validate(['evTitle', 'evDesc', 'evDate', 'evTime', 'evLocation']) || !requireAudience('ev')) return;
          aud = audienceTarget('ev', 'event');
          payload = {
            title: $('evTitle').value.trim(),
            description: $('evDesc').value.trim(),
            category: $('evCategory').value,
            date: $('evDate').value,
            time: to12h($('evTime').value),
            location: $('evLocation').value.trim(),
            ...aud.fields
          };
        } else if (kind === 'poll') {
          if (!validate(['plQuestion', 'plClosing'])) return;
          const texts = [...$('plChoices').querySelectorAll('input')].map(i => i.value.trim());
          const filled = texts.filter(Boolean);
          const dupes = new Set(filled.map(t => t.toLowerCase())).size !== filled.length;
          if (filled.length < MIN_CHOICES || filled.length !== texts.length) {
            [...$('plChoices').querySelectorAll('input')].forEach(i => { if (!i.value.trim()) i.classList.add('invalid'); });
            UI.toast('Fill in every choice or remove the empty ones (at least ' + MIN_CHOICES + ' choices).', 'warning');
            return;
          }
          if (dupes) { UI.toast('Two choices are the same. Please make each choice different.', 'warning'); return; }
          if ($('plClosing').value < today()) {
            $('plClosing').classList.add('invalid');
            UI.toast('The closing date can’t be in the past.', 'warning');
            return;
          }
          if (!requireAllCampus('pl')) return;
          payload = {
            question: $('plQuestion').value.trim(),
            description: $('plDesc').value.trim(),
            choices: filled.map((text, i) => ({ id: 'c' + (i + 1), text })),
            category: $('plCategory').value,
            closingDate: $('plClosing').value,
            ...hubFields()
          };
        } else {
          if (!validate(['ntTitle', 'ntMessage']) || !requireAudience('nt')) return;
          aud = audienceTarget('nt', 'notification');
          payload = {
            title: $('ntTitle').value.trim(),
            message: $('ntMessage').value.trim(),
            category: $('ntCategory').value,
            type: $('ntType').value,
            icon: $('ntIcon').value,
            ...aud.fields
          };
        }

        try {
          const collectionName = aud ? aud.collection : HUB[kind].collection;
          console.info('Admin Hub: publishing to ' + collectionName, { ...payload, createdAt: '(server time)' });
          await withTimeout(addDoc(collection(db, collectionName), payload), 15000);
        } catch (err) {
          console.error(err);
          const denied = err && err.code === 'permission-denied';
          UI.toast(denied
            ? 'Firebase denied the request. Publish the new Firestore rules, then try again.'
            : 'Couldn’t send it' + (err && err.code ? ' (' + err.code + ')' : '') + ': ' + ((err && err.message) || 'see the browser console.'), 'error');
          return;
        }

        UI.toast(({ announcement: 'Announcement published!', event: 'Event created!', notification: 'Notification sent!', poll: 'Poll created!' }[kind]) + (aud && aud.sentTo ? ' Sent to ' + aud.sentTo + '.' : ''), 'success');
        UI.closeModal(FORMS[kind].modalId);
        renderFeed();
      }

      // ─── Feed ───
      function buildFeed() {
        const dayMs = (d) => new Date((d || today()) + 'T00:00:00').getTime();

        return [
          ...[...HUB.announcement.items, ...HUB.announcementSS.items].map(a => ({ type: 'announcement', data: a, category: a.category, rank: a.pinned ? 0 : 1, sort: a.createdMs || dayMs(a.date) })),
          ...[...HUB.event.items, ...HUB.eventSS.items].map(e => ({ type: 'event', data: e, category: e.category, rank: 1, sort: dayMs(e.date) })),
          ...[...HUB.notification.items, ...HUB.notificationSS.items].map(n => ({ type: 'notification', data: n, category: n.category, rank: 1, sort: n.createdMs || dayMs(n.date) })),
          ...HUB.poll.items.map(p => ({ type: 'poll', data: p, category: p.category, rank: 1, sort: p.createdMs || dayMs(p.date) }))
        ].sort((a, b) => a.rank - b.rank || b.sort - a.sort);
      }

      function applyFilters(feed) {
        return feed.filter(item => {
          if (item.type !== typeFilter) return false;
          if (categoryFilter !== 'all' && item.category !== categoryFilter) return false;
          if (!searchTerm) return true;
          const d = item.data;
          return [d.title, d.question, d.body, d.description, d.message, d.category, d.author, d.location]
            .some(v => v && String(v).toLowerCase().includes(searchTerm));
        });
      }

      function renderFeed() {
        const feed = buildFeed();
        const failed = [];
        Object.entries(HUB).forEach(([type, hub]) => {
          if (!hub.error) return;
          failed.push(hub.error.code === 'permission-denied'
            ? LABELS[type] + ' (Firebase denied access — publish the new Firestore rules)'
            : LABELS[type]);
        });
        const banner = $('hubError');
        banner.style.display = failed.length ? 'block' : 'none';
        banner.textContent = failed.length ? `Couldn’t load ${failed.join(', ')}. Open the browser console (F12) for details.` : '';

        if (votersPollId && $('pollVotersModal') && $('pollVotersModal').classList.contains('active')) renderVoters();

        const items = applyFilters(feed);
        const container = $('hubFeed');
        const empty = $('hubEmpty');

        if (!items.length && !Object.values(HUB).every(hub => hub.ready)) {
          container.innerHTML = '';
          empty.innerHTML = '<div class="empty-icon">⏳</div><h3>Loading updates…</h3>';
          empty.style.display = 'block';
          return;
        }

        if (!items.length) {
          const filtering = categoryFilter !== 'all' || searchTerm;
          container.innerHTML = '';
          empty.innerHTML = filtering
            ? '<div class="empty-icon">📭</div><h3>No updates found</h3><p>Try adjusting your search or filter criteria.</p>'
            : '<div class="empty-icon">📭</div><h3>Nothing sent yet</h3><p>Use the button at the top right to publish your first update.</p>';
          empty.style.display = 'block';
          return;
        }

        empty.style.display = 'none';
        container.innerHTML = items.map(i => {
          try {
            return i.type === 'announcement' ? announcementCard(i.data) :
                   i.type === 'event' ? eventCard(i.data) :
                   i.type === 'poll' ? pollCard(i.data) : notificationCard(i.data);
          } catch (err) {
            console.error('Admin Hub: could not draw an item', i, err);
            return '';
          }
        }).join('');
      }

      function announcementCard(a) {
        return `
          <div class="hub-feed-item hub-item-announcement" id="hub-ann-${esc(a.id)}">
            <div class="card-priority ${esc(a.priority)}"></div>
            <div style="padding-left:12px;">
              <div class="hub-type-label type-announcement">📢 ANNOUNCEMENT</div>
              <div class="flex items-center gap-md" style="flex-wrap:wrap; margin-bottom:var(--space-sm);">
                ${a.pinned ? '<span class="badge badge-primary">📌 Pinned</span>' : ''}
                ${UI.priorityBadge(a.priority)}
                ${UI.categoryBadge(esc(a.category))}
              </div>
              <h3 style="margin-bottom:var(--space-sm);">${esc(a.title)}</h3>
              <div class="announcement-body">${esc(a.body)}</div>
              <div class="announcement-meta">
                <span>✍️ ${esc(a.author)}</span>
                <span>📅 ${UI.formatDate(a.date)}</span>
                ${audienceLabel(a)}
              </div>
              <div class="hub-actions">
                <button class="hub-action-btn" data-action="pin" data-id="${esc(a.id)}" data-collection="${esc(a._collection || 'announcement_hub')}" data-pinned="${a.pinned ? '1' : '0'}">${a.pinned ? '📌 Unpin' : '📌 Pin'}</button>
                <button class="hub-action-btn ah-actions-danger" data-action="delete" data-type="announcement" data-collection="${esc(a._collection || 'announcement_hub')}" data-id="${esc(a.id)}">🗑️ Delete</button>
              </div>
            </div>
          </div>`;
      }

      function eventCard(ev) {
        const d = new Date(ev.date + 'T00:00:00');
        return `
          <div class="hub-feed-item hub-item-event" id="hub-ev-${esc(ev.id)}">
            <div class="hub-type-label type-event">📅 EVENT</div>
            <div class="hub-event-layout">
              <div class="event-date-badge" style="width:52px; height:58px;">
                <span class="day" style="font-size:1.2rem;">${d.getDate()}</span>
                <span class="month" style="font-size:0.6rem;">${d.toLocaleDateString('en-US', { month: 'short' })}</span>
              </div>
              <div style="flex:1; min-width:0;">
                <div class="flex items-center gap-md" style="flex-wrap:wrap; margin-bottom:var(--space-sm);">
                  <span class="tag">${esc(ev.category)}</span>
                  <span class="text-muted text-sm">${d.toLocaleDateString('en-US', { weekday: 'long' })}</span>
                </div>
                <h3 style="margin-bottom:var(--space-sm);">${esc(ev.title)}</h3>
                <p class="text-secondary text-sm" style="margin-bottom:var(--space-md); line-height:1.6;">${esc(ev.description)}</p>
                <div class="flex items-center gap-lg" style="flex-wrap:wrap;">
                  <span class="text-muted text-sm">📍 ${esc(ev.location)}</span>
                  <span class="text-muted text-sm">🕐 ${esc(ev.time)}</span>
                  ${audienceLabel(ev)}
                </div>
              </div>
            </div>
            <div class="hub-actions">
              <button class="hub-action-btn ah-actions-danger" data-action="delete" data-type="event" data-collection="${esc(ev._collection || 'event_hub')}" data-id="${esc(ev.id)}">🗑️ Delete</button>
            </div>
          </div>`;
      }

      function pollCard(p) {
        const choices = Array.isArray(p.choices) ? p.choices : [];
        const closed = p.closingDate && p.closingDate < today();
        const votes = VOTERS.items.filter(v => v.pollId === p.id);
        const total = votes.length;
        const results = choices.map(c => {
          const n = votes.filter(v => String(v.choiceId) === String(c.id)).length;
          const pct = total ? Math.round((n / total) * 100) : 0;
          return `
            <div class="pl-result">
              <div class="pl-result-head"><span>${esc(c.text)}</span><span>${pct}% · ${n} ${n === 1 ? 'vote' : 'votes'}</span></div>
              <div class="pl-bar-track"><div class="pl-bar" style="width:${pct}%;"></div></div>
            </div>`;
        }).join('');
        return `
          <div class="hub-feed-item hub-item-poll" id="hub-poll-${esc(p.id)}">
            <div class="hub-type-label type-poll">📊 POLL</div>
            <div class="flex items-center gap-md" style="flex-wrap:wrap; margin-bottom:var(--space-sm);">
              <span class="tag">${esc(p.category)}</span>
              <span class="badge ${closed ? '' : 'badge-primary'}">${closed ? 'Closed' : 'Open'}</span>
            </div>
            <h3 style="margin-bottom:var(--space-sm);">${esc(p.question)}</h3>
            ${p.description ? `<p class="text-secondary text-sm" style="margin-bottom:var(--space-md); line-height:1.6;">${esc(p.description)}</p>` : ''}
            <div style="margin-bottom:var(--space-md);">${results}</div>
            ${VOTERS.error ? '<p class="text-sm" style="color:#fca5a5; margin-bottom:var(--space-md);">Couldn’t load votes. Publish the new Firestore rules, then refresh.</p>' : ''}
            <div class="flex items-center gap-lg" style="flex-wrap:wrap;">
              <span class="text-muted text-sm">👥 ${total} ${total === 1 ? 'student has' : 'students have'} voted</span>
              <span class="text-muted text-sm">⏳ ${closed ? 'Closed' : 'Closes'} ${UI.formatDate(p.closingDate)}</span>
              <span class="text-muted text-sm">✍️ ${esc(p.author)}</span>
              ${audienceLabel(p)}
            </div>
            <div class="hub-actions">
              <button class="hub-action-btn" data-action="voters" data-id="${esc(p.id)}">👥 Who voted</button>
              <button class="hub-action-btn ah-actions-danger" data-action="delete" data-type="poll" data-id="${esc(p.id)}">🗑️ Delete</button>
            </div>
          </div>`;
      }

      // ─── Who voted ───
      function renderVoters() {
        const poll = HUB.poll.items.find(x => x.id === votersPollId);
        if (!poll) return;
        const votes = VOTERS.items.filter(v => v.pollId === poll.id).sort((a, b) => a.createdMs - b.createdMs);
        $('pollVotersTitle').textContent = poll.question;
        const when = (ms) => ms ? new Date(ms).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : '';
        if (!votes.length) {
          $('pollVotersBody').innerHTML = '<div class="empty-state"><div class="empty-icon">🗳️</div><h3>No votes yet</h3><p>Students who vote will appear here.</p></div>';
          return;
        }
        $('pollVotersBody').innerHTML = `<p class="text-muted text-sm" style="margin-bottom:var(--space-lg);">${votes.length} ${votes.length === 1 ? 'student has' : 'students have'} voted.</p>` +
          (poll.choices || []).map(c => {
            const group = votes.filter(v => String(v.choiceId) === String(c.id));
            return `
              <div class="pl-voter-group">
                <h4><span>${esc(c.text)}</span><span class="text-muted">${group.length}</span></h4>
                ${group.length ? group.map(v => `
                  <div class="pl-voter-row">
                    <div>${esc(v.voterName || 'Student')}<small>${esc([v.voterEmail, v.department, v.year].filter(Boolean).join(' · '))}</small></div>
                    <time>${esc(when(v.createdMs))}</time>
                  </div>`).join('') : '<div class="text-muted text-sm">No votes for this choice.</div>'}
              </div>`;
          }).join('');
      }

      function openVoters(pollId) {
        votersPollId = pollId;
        renderVoters();
        UI.openModal('pollVotersModal');
      }

      function notificationCard(n) {
        return `
          <div class="hub-feed-item hub-item-notification" id="hub-notif-${esc(n.id)}">
            <div class="hub-type-label type-notification">🔔 NOTIFICATION</div>
            <div class="flex items-center gap-md">
              <div class="notification-dot ${esc(n.type)}">${esc(n.icon)}</div>
              <div style="flex:1; min-width:0;">
                <div class="font-semibold text-sm" style="margin-bottom:2px;">${esc(n.title)}</div>
                <div class="text-secondary" style="font-size:0.83rem; margin-bottom:4px;">${esc(n.message)}</div>
                <div class="text-muted" style="font-size:0.75rem;">${esc(n.category)} · ${UI.formatDate(n.date)} ${audienceLabel(n)}</div>
              </div>
            </div>
            <div class="hub-actions">
              <button class="hub-action-btn ah-actions-danger" data-action="delete" data-type="notification" data-collection="${esc(n._collection || 'notification_hub')}" data-id="${esc(n.id)}">🗑️ Delete</button>
            </div>
          </div>`;
      }

      // ─── Actions ───
      // Pressing Delete opens the confirmation popup; the popup's Delete button runs deleteItem().
      let pendingDelete = null;

      function askDelete(type, id, collectionName) {
        pendingDelete = { type, id, collectionName };
        $('deleteConfirmTitle').textContent = `Delete this ${type}?`;
        $('deleteConfirmText').textContent = type === 'poll'
          ? 'This poll and all of its votes will be removed. This can’t be undone.'
          : `This ${type} will be removed for everyone. This can’t be undone.`;
        UI.openModal('deleteConfirmModal');
        $('deleteConfirmBtn').focus();
      }

      async function deleteItem(type, id, collectionName) {
        try {
          await deleteDoc(doc(db, collectionName || HUB[type].collection, id));
          if (type === 'poll') {
            const votes = VOTERS.items.filter(v => v.pollId === id);
            await Promise.all(votes.flatMap(v => [deleteDoc(doc(db, 'poll_voters', v.id)), deleteDoc(doc(db, 'poll_votes', v.id))]));
          }
        } catch (err) {
          console.error(err);
          UI.toast('Couldn’t delete it: ' + (err.message || 'see the browser console.'), 'error');
          return;
        }
        UI.toast(`${type.charAt(0).toUpperCase() + type.slice(1)} deleted.`, 'warning');
        renderFeed();
      }

      async function togglePin(id, pinned, collectionName) {
        try {
          await updateDoc(doc(db, collectionName || HUB.announcement.collection, id), { pinned: !pinned });
        } catch (err) {
          console.error(err);
          UI.toast('Couldn’t update the pin: ' + (err.message || 'see the browser console.'), 'error');
          return;
        }
        UI.toast(pinned ? 'Announcement unpinned.' : 'Announcement pinned.', 'success');
        renderFeed();
      }

      // The create button follows the selected type: All/Announcements → announcement, Events → event, Notifications → notification
      function updateCreateButton() {
        $('btnCreate').textContent = CREATE_LABELS[typeFilter];
      }

      function setChip(selector, attr, value) {
        document.querySelectorAll(selector).forEach(c => c.classList.toggle('active', c.dataset[attr] === value));
      }

      // ─── Init ───
      document.addEventListener('DOMContentLoaded', () => {
        if (!initPage('admin-hub')) return;

        buildModals();
        startHubSync();

        $('btnCreate').addEventListener('click', () => openForm(typeFilter));

        // Modal buttons and card actions
        document.addEventListener('click', (e) => {
          const closeBtn = e.target.closest('[data-close]');
          if (closeBtn) return UI.closeModal(closeBtn.dataset.close);

          const submitBtn = e.target.closest('[data-submit]');
          if (submitBtn) {
            const kind = Object.keys(FORMS).find(k => FORMS[k].modalId === submitBtn.dataset.submit);
            return submit(kind);
          }

          if (e.target.closest('[data-confirm-delete]')) {
            UI.closeModal('deleteConfirmModal');
            const item = pendingDelete;
            pendingDelete = null;
            if (item) deleteItem(item.type, item.id, item.collectionName);
            return;
          }

          const actionBtn = e.target.closest('[data-action]');
          if (!actionBtn) return;
          if (actionBtn.dataset.action === 'delete') askDelete(actionBtn.dataset.type, actionBtn.dataset.id, actionBtn.dataset.collection);
          if (actionBtn.dataset.action === 'voters') openVoters(actionBtn.dataset.id);
          if (actionBtn.dataset.action === 'pin') togglePin(actionBtn.dataset.id, actionBtn.dataset.pinned === '1', actionBtn.dataset.collection);
        });

        // Filters and search
        document.querySelectorAll('.hub-filter-chip').forEach(c => c.addEventListener('click', () => {
          typeFilter = c.dataset.type;
          setChip('.hub-filter-chip', 'type', typeFilter);
          updateCreateButton();
          renderFeed();
        }));
        document.querySelectorAll('.hub-cat-chip').forEach(c => c.addEventListener('click', () => {
          categoryFilter = c.dataset.cat;
          setChip('.hub-cat-chip', 'cat', categoryFilter);
          renderFeed();
        }));

        const search = $('hubSearch');
        search.addEventListener('input', () => { searchTerm = search.value.trim().toLowerCase(); renderFeed(); });
        search.addEventListener('keydown', (e) => {
          if (e.key === 'Escape') { search.value = ''; searchTerm = ''; renderFeed(); search.blur(); }
        });

        // Backdrop click and Escape close any open modal
        document.querySelectorAll('.modal-overlay').forEach(m => {
          m.addEventListener('click', (e) => { if (e.target === m) m.classList.remove('active'); });
        });
        document.addEventListener('keydown', (e) => {
          if (e.key === 'Escape') document.querySelectorAll('.modal-overlay.active').forEach(m => m.classList.remove('active'));
        });

        // Deep link: admin-hub.html?create=announcement | event | notification | poll
        const create = new URLSearchParams(window.location.search).get('create');
        if (FORMS[create]) {
          typeFilter = create;
          setChip('.hub-filter-chip', 'type', typeFilter);
          updateCreateButton();
          openForm(create);
        }

        renderFeed();
      });
    })();
  </script>
</body>

</html>
